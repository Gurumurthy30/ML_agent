<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Agent ML Pipeline</title>
  <meta name="description" content="Claude.ai-style live monitoring and interactive control for the Multi-Agent ML Pipeline.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✳️</text></svg>">
  
  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            terracotta: {
              DEFAULT: '#D97757',
              hover: '#C85A32',
              light: '#FBF0EB',
              dark: '#E28466',
            },
            neutral: {
              cream: '#FAF9F6',
              card: '#FFFFFF',
              darkbg: '#141416',
              darkcard: '#202024',
            }
          }
        }
      }
    }
  </script>

  <!-- Highlight.js for code syntax highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/bash.min.js"></script>

  <!-- Marked.js for markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-[#FAF9F6] dark:bg-[#141416] text-stone-900 dark:text-stone-100 flex h-screen overflow-hidden antialiased">

  <!-- Left Sidebar (Past Runs & Navigation) -->
  <aside id="left-sidebar" class="w-64 flex-shrink-0 bg-stone-50/70 dark:bg-[#1A1A1E] border-r border-stone-200/80 dark:border-zinc-800 flex flex-col justify-between transition-all duration-200 z-20">
    <div class="p-4 flex flex-col h-full overflow-hidden">
      <!-- App Brand / Header -->
      <div class="flex items-center justify-between pb-4 border-b border-stone-200/70 dark:border-zinc-800">
        <div class="flex items-center space-x-2.5">
          <div class="w-7 h-7 rounded-lg bg-[#D97757] flex items-center justify-center text-white font-bold text-sm shadow-sm">
            ✳
          </div>
          <div>
            <h1 class="text-sm font-semibold tracking-tight text-stone-900 dark:text-stone-100">ML Pipeline</h1>
            <p class="text-[11px] text-stone-500 dark:text-stone-400">Agentic Orchestration</p>
          </div>
        </div>
      </div>

      <!-- New Run Button -->
      <div class="mt-4">
        <button id="new-run-btn" class="w-full flex items-center justify-center space-x-2 px-3.5 py-2.5 rounded-xl bg-white dark:bg-zinc-800 hover:bg-stone-100 dark:hover:bg-zinc-700/80 border border-stone-200 dark:border-zinc-700 text-xs font-medium text-stone-800 dark:text-stone-200 shadow-sm transition-all">
          <svg class="w-3.5 h-3.5 text-[#D97757]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/>
          </svg>
          <span>New Pipeline Run</span>
        </button>
      </div>

      <!-- Past Runs Section -->
      <div class="mt-5 flex-1 flex flex-col min-h-0">
        <div class="flex items-center justify-between mb-2 px-1">
          <span class="text-[11px] font-semibold uppercase tracking-wider text-stone-400 dark:text-stone-500">Recent Runs</span>
          <button id="refresh-runs-btn" title="Refresh runs list" class="text-stone-400 hover:text-stone-600 dark:hover:text-stone-300">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
            </svg>
          </button>
        </div>
        <div id="runs-list" class="flex-1 overflow-y-auto space-y-1.5 pr-1">
          <!-- Dynamically populated by app.js -->
          <div class="p-3 text-center text-xs text-stone-400 dark:text-stone-500 italic">No past runs recorded</div>
        </div>
      </div>

      <!-- Footer Controls (Dark mode & Status) -->
      <div class="pt-3 border-t border-stone-200/70 dark:border-zinc-800 flex items-center justify-between text-xs text-stone-500 dark:text-stone-400">
        <button id="theme-toggle-btn" class="flex items-center space-x-1.5 hover:text-stone-900 dark:hover:text-stone-200 py-1 px-2 rounded-lg transition-colors">
          <span id="theme-icon">🌙</span>
          <span id="theme-label" class="text-[11px] font-medium">Dark Mode</span>
        </button>
        <span class="inline-flex items-center space-x-1 text-[11px]">
          <span id="server-status-dot" class="w-2 h-2 rounded-full bg-emerald-500"></span>
          <span id="server-status-text">Ready</span>
        </span>
      </div>
    </div>
  </aside>

  <!-- Center Main Stream Column -->
  <main class="flex-1 flex flex-col h-full overflow-hidden relative">
    
    <!-- Top Bar Navigation -->
    <header class="h-14 border-b border-stone-200/70 dark:border-zinc-800 bg-white/80 dark:bg-[#141416]/80 backdrop-blur-sm px-6 flex items-center justify-between flex-shrink-0 z-10">
      <div class="flex items-center space-x-3">
        <button id="toggle-sidebar-btn" class="text-stone-400 hover:text-stone-600 dark:hover:text-stone-300 md:hidden">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
        <div id="header-run-info" class="flex items-center space-x-2">
          <span id="header-run-id" class="text-xs font-mono font-medium text-stone-600 dark:text-stone-400">No active run</span>
          <span id="header-run-status-pill" class="hidden px-2 py-0.5 rounded-full text-[10px] font-semibold"></span>
        </div>
      </div>

      <div class="flex items-center space-x-2">
        <!-- Execution Trace Toggle Button -->
        <button id="toggle-trace-btn" class="flex items-center space-x-1.5 px-3 py-1.5 rounded-lg border border-stone-200 dark:border-zinc-700 hover:bg-stone-100 dark:hover:bg-zinc-800 text-xs font-medium text-stone-600 dark:text-stone-300 transition-colors">
          <svg class="w-3.5 h-3.5 text-stone-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <span>Trace</span>
        </button>
      </div>
    </header>

    <!-- Scrollable Chat Feed Container -->
    <div id="feed-container" class="flex-1 overflow-y-auto px-4 md:px-8 py-6 space-y-6 scroll-smooth">
      <div class="max-w-3xl mx-auto space-y-6">

        <!-- Run Configuration Card (Claude Style) -->
        <section id="config-card" class="bg-white dark:bg-[#202024] border border-stone-200/80 dark:border-zinc-800/90 rounded-2xl shadow-sm p-6 space-y-5 animate-card-in">
          <div class="flex items-center justify-between pb-2 border-b border-stone-100 dark:border-zinc-800">
            <div>
              <h2 class="text-base font-semibold text-stone-900 dark:text-stone-100">Configure ML Pipeline</h2>
              <p class="text-xs text-stone-500 dark:text-stone-400">Select your dataset and orchestration mode</p>
            </div>
            <span class="px-2.5 py-1 rounded-full text-[11px] font-medium bg-orange-50 dark:bg-orange-950/30 text-[#D97757] border border-orange-200/60 dark:border-orange-900/50">
              Autonomous
            </span>
          </div>

          <form id="run-config-form" class="space-y-4" onsubmit="event.preventDefault();">
            <!-- Dataset Path Input -->
            <div>
              <label for="dataset-input" class="block text-xs font-medium text-stone-700 dark:text-stone-300 mb-1.5">
                Dataset File Path (.csv or .parquet)
              </label>
              <input id="dataset-input" type="text" required value="_extras/data/train.csv" placeholder="e.g. _extras/data/train.csv"
                class="w-full px-3.5 py-2.5 rounded-xl border border-stone-200 dark:border-zinc-700 bg-stone-50/50 dark:bg-[#18181C] text-xs font-mono text-stone-900 dark:text-stone-100 focus:outline-none focus:ring-2 focus:ring-[#D97757]/40 focus:border-[#D97757] transition-all">
              
              <!-- Quick Select Chips -->
              <div class="flex items-center space-x-2 mt-2">
                <span class="text-[11px] text-stone-400 dark:text-stone-500">Quick select:</span>
                <button type="button" class="quick-chip px-2.5 py-1 rounded-md text-[11px] font-mono bg-stone-100 dark:bg-zinc-800 hover:bg-stone-200 dark:hover:bg-zinc-700 text-stone-600 dark:text-stone-300 transition-colors" data-path="_extras/data/train.csv">
                  train.csv (Churn demo)
                </button>
              </div>
            </div>

            <!-- Pipeline Mode & Guided Mode Row -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-1">
              <div>
                <label for="mode-select" class="block text-xs font-medium text-stone-700 dark:text-stone-300 mb-1.5">
                  Pipeline Mode
                </label>
                <select id="mode-select" class="w-full px-3.5 py-2 rounded-xl border border-stone-200 dark:border-zinc-700 bg-stone-50/50 dark:bg-[#18181C] text-xs text-stone-900 dark:text-stone-100 focus:outline-none focus:ring-2 focus:ring-[#D97757]/40 focus:border-[#D97757]">
                  <option value="full_pipeline" selected>Full Pipeline (EDA + Features + Modeler + Judge + Report)</option>
                  <option value="eda_only">EDA Only (Exploratory Data Analysis)</option>
                </select>
              </div>

              <div class="flex flex-col justify-end">
                <div class="flex items-center space-x-2.5 p-2 rounded-xl bg-stone-50/50 dark:bg-[#18181C] border border-stone-200 dark:border-zinc-700">
                  <input id="guided-mode-toggle" type="checkbox" class="w-4 h-4 text-[#D97757] rounded border-stone-300 focus:ring-[#D97757]">
                  <label for="guided-mode-toggle" class="text-xs text-stone-700 dark:text-stone-300 select-none cursor-pointer">
                    <span class="font-medium">Guided Mode</span>
                    <span class="block text-[10px] text-stone-400 dark:text-stone-500">Require human approval on every feature step</span>
                  </label>
                </div>
              </div>
            </div>

            <!-- Submit Button (Claude Terracotta Style) -->
            <div class="pt-2">
              <button id="start-run-btn" type="submit" class="w-full py-2.5 px-4 rounded-xl bg-[#D97757] hover:bg-[#C85A32] text-white font-medium text-sm shadow-sm hover:shadow-md hover:-translate-y-0.5 active:translate-y-0 transition-all duration-150 flex items-center justify-center space-x-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                <span>Run Pipeline</span>
              </button>
            </div>
          </form>
        </section>

        <!-- Turn Cards Feed (Appended Live by app.js) -->
        <div id="turns-feed" class="space-y-6">
          <!-- Dynamic cards inserted here -->
        </div>

      </div>
    </div>

    <!-- Floating "↓ New Activity" Jump Button -->
    <div id="scroll-bottom-container" class="absolute bottom-6 right-8 z-20 hidden">
      <button id="scroll-down-btn" class="flex items-center space-x-1.5 px-3.5 py-2 rounded-full bg-white dark:bg-zinc-800 text-xs font-medium text-stone-700 dark:text-stone-200 shadow-lg border border-stone-200 dark:border-zinc-700 hover:bg-stone-50 dark:hover:bg-zinc-700 transition-all">
        <svg class="w-3.5 h-3.5 text-[#D97757] animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 14l-7 7m0 0l-7-7m7 7V3"/>
        </svg>
        <span>New activity</span>
      </button>
    </div>

  </main>

  <!-- Right Drawer (Chronological Trace Timeline) -->
  <aside id="right-drawer" class="w-72 flex-shrink-0 bg-stone-50/70 dark:bg-[#1A1A1E] border-l border-stone-200/80 dark:border-zinc-800 flex flex-col justify-between transition-all duration-200 z-20 hidden md:flex">
    <div class="p-4 flex flex-col h-full overflow-hidden">
      <!-- Drawer Header -->
      <div class="flex items-center justify-between pb-3 border-b border-stone-200/70 dark:border-zinc-800">
        <div class="flex items-center space-x-2">
          <span class="text-xs font-semibold text-stone-800 dark:text-stone-200 uppercase tracking-wider">Chronological Trace</span>
        </div>
        <button id="close-trace-btn" class="text-stone-400 hover:text-stone-600 dark:hover:text-stone-300">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <!-- Trace Steps List -->
      <div class="mt-3 flex-1 flex flex-col min-h-0">
        <div class="text-[11px] text-stone-500 dark:text-stone-400 mb-2 flex justify-between px-1">
          <span>Agent / Step</span>
          <span>Duration</span>
        </div>
        <div id="trace-timeline" class="flex-1 overflow-y-auto space-y-2 pr-1">
          <div class="p-3 text-center text-xs text-stone-400 dark:text-stone-500 italic">No events logged yet</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- Application Logic -->
  <script src="app.js"></script>
</body>
</html>
