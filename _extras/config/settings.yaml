model:
  # --- API-only mode — no local GPU serving, no GGUF download ---
  # All model calls are OpenAI-compatible REST API calls.
  # Base config (used only as final fallback if all three providers fail).
  server_url: "https://integrate.api.nvidia.com/v1"
  name: "deepseek-ai/deepseek-v4-flash-0731"
  api_key_env: "NVIDIA_API_KEY"

  # --- Role-based Provider Routing ---
  # roles: selector, planner_deep → deep_thinking_provider (NVIDIA NIM / DeepSeek)
  # roles: coder, planner_default → primary_provider (Groq), failover → fallback_provider (Google)

  # DeepSeek V4 on NVIDIA NIM — deep thinking calls only (Planner ToT, Selector always)
  deep_thinking_provider:
    server_url: "https://integrate.api.nvidia.com/v1"
    name: "deepseek-ai/deepseek-v4-flash-0731"
    api_key_env: "NVIDIA_API_KEY"

  # Fast primary provider — Coder, Planner default mode
  primary_provider:
    server_url: "https://api.groq.com/openai/v1"
    name: "openai/gpt-oss-120b"
    api_key_env: "GROQ_API_KEY"

  # Automatic failover provider (on 429 or quota exhaustion)
  fallback_provider:
    server_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
    name: "gemini-3.1-flash-lite"
    api_key_env: "GOOGLE_API_KEY"

budget:
  actions_total: 100
  time_total_minutes: 60.0

selector:
  plateau_n_rounds: 3
  plateau_epsilon_relative: 0.005

rag:
  library_docs_path: "rag/library_docs_index"
  technique_cheatsheet_path: "rag/technique_cheatsheet_index"
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  source_docs_path: ""         # REQUIRED for build_index.py — local path, no download

sessions:
  storage_path: "state/sessions/"
  checkpointer: "memory"       # swap to "sqlite" or "postgres" before multi-restart prod use
  exec_timeout_seconds: 300    # subprocess hard timeout for execute_code
  upload_staging_path: "state/upload_staging/"